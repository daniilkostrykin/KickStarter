services:
  kickstarter-rabbitmq:
    image: rabbitmq:4.0-management
    container_name: kickstarter-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - kickstarter-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  kickstarter-network:
    driver: bridge

volumes:
  rabbitmq_data: