services:
  kickstarter-rabbitmq:
    image: rabbitmq:4.0-management
    container_name: kickstarter-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - kickstarter-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  kickstarter-postgres:
    image: postgres:16-alpine
    container_name: kickstarter-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kickstarter_db}
      POSTGRES_USER: ${POSTGRES_USER:-kickstarter_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kickstarter_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kickstarter-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kickstarter_user} -d ${POSTGRES_DB:-kickstarter_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    command: [ "start-dev", "--import-realm", "--health-enabled=true" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin-dev-only}
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:8085}
    ports:
      - "127.0.0.1:8085:8080"
    volumes:
      - ./infra/keycloak/kickstarter-realm.json:/opt/keycloak/data/import/kickstarter-realm.json:ro
networks:
  kickstarter-network:
    driver: bridge

volumes:
  rabbitmq_data:
  postgres_data: