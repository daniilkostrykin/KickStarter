spring:
  application:
    name: audit-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8085/realms/kickstarter}
          audiences: audit-service
    # Подключение к локальному брокеру
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

    #  Spring Boot передаёт trace-id из AMQP-заголовков в MDC логгера.
    # Это позволяет связать запрос в demo-rest с обработкой в audit-service.
    listener:
      simple:
        auto-startup: false
        observation-enabled: true
        # При ошибке обработки повторить 3 раза с интервалом 2 секунды.
        # После исчерпания попыток сообщение уходит в DLQ (настроено в RabbitMQConfig).
        retry:
          enabled: true
          initial-interval: 2000
          multiplier: 2.0
          max-retries: 3

    template:
      observation-enabled: true

# audit-service работает на другом порту, чтобы не конфликтовать с demo-rest (8080)
server:
  port: 8081

# Health endpoint показывает состояние подключения к RabbitMQ.
# В прод системах это используется для readiness-проверок в Kubernetes.
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always
