spring.application.name=kickstarter-rest

# Активный профиль безопасности (Лабораторная работа 2): включает SessionSecurityConfig
# (formLogin + CookieCsrfTokenRepository + RBAC) и CsrfController. Без этого профиля
# Spring Boot использует дефолтную security-конфигурацию, и сценарий lab2.http не работает.
spring.profiles.active=session-auth
spring.graphql.schema.introspection.enabled=true

# GraphiQL — интерактивная IDE для тестирования GraphQL-запросов.
# Доступна по адресу http://localhost:8080/graphiql после запуска приложения.
spring.graphql.graphiql.enabled=true

# Путь к GraphQL-endpoint
spring.graphql.path=/graphql

# Расположение GraphQL-схемы для Spring for GraphQL.
spring.graphql.schema.locations=classpath*:graphql/

# Расположение GraphQL-схемы для DGS.
# DGS использует свой собственный механизм поиска схемы, отдельный от Spring for GraphQL.
# По умолчанию: classpath*:schema/**/*.graphql* — нужно переопределить.
dgs.graphql.schema-locations=classpath*:graphql/**/*.graphqls

# --- PostgreSQL Datasource ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kickstarter_db}
spring.datasource.username=${DB_USER:kickstarter_user}
spring.datasource.password=${DB_PASSWORD:kickstarter_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# --- RabbitMQ ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# --- Session & Cookie Configuration ---
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}